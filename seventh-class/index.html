<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card Structure</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <div class="intro">
    Introduction
  </div>

  <p class="intro-text">
   Sivaji is a legendary figure in Indian cinema, admired for his versatile acting,
   charismatic presence, and contribution to the film industry.
  </p>

  <div class="card">
    <img src="Sivaji.jpg" alt="Sivaji">

    <h2 class="card-title">Sivaji</h2>

    <p class="card-desc">
      Sivaji was an iconic Indian actor known for his memorable performances
      and immense influence on the Tamil film industry.
    </p>
  </div>

</body>
</html>
